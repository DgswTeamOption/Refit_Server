name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test --no-daemon
          cp "$(ls build/libs/*.jar | grep -v -- '-plain')" app.jar

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload jar
        run: |
          scp -i ~/.ssh/id_deploy app.jar \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}/build/libs/refit-0.0.1-SNAPSHOT.jar.new"

      - name: Restart service
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            cd "${{ secrets.EC2_APP_DIR }}/build/libs"
            [ -f refit-0.0.1-SNAPSHOT.jar ] && cp refit-0.0.1-SNAPSHOT.jar refit-0.0.1-SNAPSHOT.jar.bak
            mv refit-0.0.1-SNAPSHOT.jar.new refit-0.0.1-SNAPSHOT.jar
            sudo systemctl restart refit
            sleep 10
            systemctl is-active --quiet refit || { sudo journalctl -u refit -n 50 --no-pager; exit 1; }
          '
