server:
  # 리버스 프록시(HTTPS 종단) 뒤에서 X-Forwarded-* 헤더를 신뢰해 https 기준으로 URL 생성 (Swagger 등)
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: refit
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      # 이미지 업로드 용량 제한 (초과 시 MaxUploadSizeExceededException -> 413)
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    # 뷰 렌더링까지 DB 커넥션을 쥐고 있지 않도록 해제 (조회는 서비스 트랜잭션 안에서 끝남)
    open-in-view: false
    properties:
      hibernate:
        # 지연 로딩 시 N+1 대신 IN 절로 묶어서 조회
        default_batch_fetch_size: 100
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # 응답 지연 방지용 타임아웃(ms). 미설정 시 무한 대기
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: 1800000      # 30분
  refresh-expiration-ms: 1209600000  # 14일
  email-secret: ${JWT_EMAIL_SECRET}
  email-code-expiration-ms: 300000
  email-verified-expiration-ms: 1800000

# 쉼표로 여러 개 지정. 배포 시 CORS_ALLOWED_ORIGINS 환경변수로 덮어씀
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://refit.team,https://www.refit.team}

google:
  client-ids: ${GOOGLE_CLIENT_IDS}

# 업로드 이미지 저장 경로와 외부에서 접근할 때의 기본 주소
file:
  upload-dir: ${FILE_UPLOAD_DIR:${user.home}/uploads}
  base-url: ${FILE_BASE_URL:https://refit.team}

# NFC 태그에 기록할 출석 주소의 기본 주소(웹 주소 또는 앱 딥링크). 서버가 ?token={token}을 붙여 내려준다.
nfc:
  attendance-url: ${NFC_ATTENDANCE_URL:https://refit.team/nfc/attendance}

# NFC 출석 시간 정책 (분). 시작 early-minutes 전부터 출석 가능, 시작 후 late-after-minutes까지는 출석(PRESENT),
# 그 이후 수업 종료까지는 지각(LATE), 종료 후에는 출석 불가. 보강은 보강 시작 시각 기준 + 원래 회차와 같은 수업 시간.
attendance:
  nfc:
    early-minutes: ${ATTENDANCE_NFC_EARLY_MINUTES:10}
    late-after-minutes: ${ATTENDANCE_NFC_LATE_AFTER_MINUTES:10}
